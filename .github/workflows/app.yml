name: app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'catalog/**'
      - '.rubocop.yml'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'catalog/**'
      - '.rubocop.yml'
      - '.github/workflows/app.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: app
      - run: bin/rails db:prepare
      - run: bundle exec rake
