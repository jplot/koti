name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'front/**'
      - 'catalog/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'front/**'
      - 'catalog/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Dockerfile -t koti:ci .
      - name: Boot the image against PostgreSQL
        run: |
          docker network create koti
          docker run -d --name db --network koti -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=koti postgres:18
          for attempt in $(seq 1 30); do docker exec db pg_isready -U postgres -d koti && break; sleep 2; done
          docker run -d --name web --network koti -p 3000:3000 \
            -e DATABASE_URL=postgres://postgres:ci@db/koti -e SECRET_KEY_BASE="$(openssl rand -hex 64)" koti:ci
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000/up && break; sleep 2; done
          curl -fsS http://localhost:3000/up
          curl -fsS http://localhost:3000/login | grep -q '<div id="app">'
          curl -fsSI http://localhost:3000/ | grep -qi '^cache-control: no-cache'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/plan)" = 401
      - if: failure()
        run: docker logs web || true
