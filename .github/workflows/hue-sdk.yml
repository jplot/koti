name: hue-sdk

on:
  push:
    branches: [main]
    paths:
      - 'hue-sdk/**'
      - '.rubocop.yml'
      - '.github/workflows/hue-sdk.yml'
  pull_request:
    paths:
      - 'hue-sdk/**'
      - '.rubocop.yml'
      - '.github/workflows/hue-sdk.yml'

permissions:
  contents: read

jobs:
  check:
    # libgpac is packaged by Ubuntu 24.04 (2.2.1), no longer by 26.04 nor by Debian 12 and 13.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hue-sdk
    steps:
      - uses: actions/checkout@v7
      # Clips are read and written through libgpac, found by name as the system finds libraries.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgpac-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: hue-sdk
      - run: bundle exec rake
