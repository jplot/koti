// Source of sample.pb: protoc --descriptor_set_out=sample.pb sample.proto
syntax = "proto3";

package koti.sample;

enum Level {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_LOW = 1;
  LEVEL_HIGH = 2;
}

message Scalars {
  double a_double = 1;
  float a_float = 2;
  int64 a_int64 = 3;
  uint64 a_uint64 = 4;
  int32 a_int32 = 5;
  fixed64 a_fixed64 = 6;
  fixed32 a_fixed32 = 7;
  bool a_bool = 8;
  string a_string = 9;
  bytes a_bytes = 12;
  uint32 a_uint32 = 13;
  Level a_level = 14;
  sfixed32 a_sfixed32 = 15;
  sfixed64 a_sfixed64 = 16;
  sint32 a_sint32 = 17;
  sint64 a_sint64 = 18;
}

message Sample {
  int32 a = 1;
  repeated int32 numbers = 2;
  map<string, int32> counts = 3;
  Scalars scalars = 4;
  repeated Scalars items = 5;
  oneof choice {
    string name = 6;
    Level level = 7;
  }
  optional uint32 maybe = 8;
}

message Newer {
  int32 a = 1;
  string extra = 99;
}
