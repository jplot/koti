inherit_from: ../.rubocop.yml

# The value classes written by schema/generate.rb: one declaration per class of the Hue app.
Metrics/ModuleLength:
  Exclude:
    - 'lib/hue/sdk/schema/*.rb'
    - 'lib/hue/sdk/secure/schema/*.rb'
    # The bindings of GPAC: one attach_function per C function the gem calls.
    - 'lib/hue/sdk/secure/gpac.rb'

# Their attributes keep the app's JSON keys, camelCase ones included (keyEnvelope).
Naming/MethodName:
  Exclude:
    - 'lib/hue/sdk/secure/schema/*.rb'
