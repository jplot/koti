inherit_from: ../.rubocop.yml

# Fixtures are child-process scripts that hand their port to the spec over stdout.
RSpec/Output:
  Exclude:
    - 'spec/fixtures/**/*'

AllCops:
  Exclude:
    - 'lib/miele/sdk/objects/families.rb'
    - 'lib/miele/sdk/objects/*/**/*'

inherit_mode:
  merge:
    - Exclude
